name: Bug Report
description: Report a reproducible bug in environment, training, or evaluation.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Include exact commands, config overrides, and seed.
    validations:
      required: true

  - type: input
    id: seed
    attributes:
      label: Seed
      placeholder: "42"

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment Details
      description: Python version, OS, package versions.
